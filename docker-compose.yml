# Start everything:  docker compose up -d --build
# Dashboard:         http://localhost:3000   (on a server: http://SERVER-IP:3000)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lead}
      POSTGRES_DB: ${POSTGRES_DB:-lead}
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=100"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # only reachable from this machine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lead}"]
      interval: 5s
      retries: 20

  worker:
    build: { context: ., dockerfile: docker/Dockerfile, target: worker }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lead}:${POSTGRES_PASSWORD:-lead}@postgres:5432/${POSTGRES_DB:-lead}
      LAKE_DIR: /data/lake
      EXPORT_DIR: /data/exports
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CRAWLER_CONTACT_EMAIL: ${CRAWLER_CONTACT_EMAIL:-crawler-contact@example.invalid}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-2GB}
      DUCKDB_THREADS: ${DUCKDB_THREADS:-4}
      DUCKDB_MAX_TEMP: ${DUCKDB_MAX_TEMP:-4GB}
      DNS_MODE: ${DNS_MODE:-}
    volumes:
      - ./data:/data

  web:
    build: { context: ., dockerfile: docker/Dockerfile, target: web }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lead}:${POSTGRES_PASSWORD:-lead}@postgres:5432/${POSTGRES_DB:-lead}
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      EXPORT_DIR: /data/exports
    volumes:
      - ./data/exports:/data/exports:ro   # the dashboard only downloads finished exports
    ports:
      - "${WEB_PORT:-3000}:3000"

  # Nightly backup of the lead database (brands, segments, leads, do-not-contact list, export history)
  # into data/backups; the last BACKUP_KEEP_DAYS days are kept. Restore steps: README → "Backups".
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-lead}
      PGPASSWORD: ${POSTGRES_PASSWORD:-lead}
      PGDATABASE: ${POSTGRES_DB:-lead}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./data/backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          f=/backups/lead-$$(date -u +%Y%m%d-%H%M).dump
          if pg_dump -Fc -f "$$f.tmp" && mv "$$f.tmp" "$$f"; then echo "backup written: $$f"; else echo "backup FAILED"; fi
          find /backups -name 'lead-*.tmp' -delete
          find /backups -name 'lead-*.dump' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done

volumes:
  pgdata:
